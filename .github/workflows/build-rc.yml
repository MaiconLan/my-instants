name: Build RC

# APK de PR com nome proprio (RC.AAAAMMDD.NNN). Ponha o label RC no PR para gerar.
# Um build de branch carrega a versao do ULTIMO release, entao no celular ficaria
# indistinguivel dele; o numero RC aparece no rodape de Ajustes.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, labeled, unlabeled]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: build-rc-${{ github.ref }}
  # Aqui cancelar e seguro: nada foi empurrado antes do build, e um push novo no PR
  # torna o APK anterior obsoleto.
  cancel-in-progress: true

defaults:
  run:
    working-directory: mobile

jobs:
  rc:
    name: APK RC
    if: contains(github.event.pull_request.labels.*.name, 'RC')
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # Primeiro, porque falha em dois segundos e o resto leva meia hora.
      - name: O EXPO_TOKEN esta configurado?
        working-directory: .
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_KEY }}
        run: |
          for v in EXPO_TOKEN SUPABASE_URL SUPABASE_KEY; do
            if [ -z "${!v:-}" ]; then
              echo "::error::Secret ausente: $v (EXPO_TOKEN, EXPO_PUBLIC_SUPABASE_URL, EXPO_PUBLIC_SUPABASE_KEY)."
              echo "::error::Settings -> Secrets and variables -> Actions. Sem URL/chave o APK abre sem conseguir logar."
              exit 1
            fi
          done

      - name: Liberar espaco em disco
        working-directory: .
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
                      /opt/hostedtoolcache/CodeQL \
                      "${ANDROID_HOME:-/usr/local/lib/android/sdk}/system-images" || true
          df -h /

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Cache do Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('mobile/package-lock.json') }}
          restore-keys: gradle-${{ runner.os }}-

      - run: npm ci

      - name: Tipos
        run: npm run typecheck

      - name: Gerar versao RC
        id: rc
        run: |
          DATE=$(date +'%Y%m%d')
          COUNT=$(git ls-remote --tags origin "refs/tags/RC.${DATE}.*" | wc -l)
          COUNT=$(printf "%03d" $((COUNT + 1)))
          echo "version=RC.${DATE}.${COUNT}" >> "$GITHUB_OUTPUT"

      # O Gradle baixa o NDK sob demanda e um download truncado derruba o build depois
      # de meia hora. Instalar aqui, com tentativas, transforma isso em retry.
      - name: Instalar o NDK com tentativas
        run: |
          set -euo pipefail
          NDK_VERSION="27.1.12297006"
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          clean() {
            rm -rf "${ANDROID_HOME}/ndk/${NDK_VERSION}" "${ANDROID_HOME}/.temp" "${HOME}/.android/cache"
            mkdir -p "${HOME}/.android/cache"
          }
          clean
          yes | "${SDKMANAGER}" --licenses >/dev/null || true
          for attempt in 1 2 3; do
            if "${SDKMANAGER}" --install "ndk;${NDK_VERSION}"; then break; fi
            echo "NDK install attempt ${attempt} failed"
            [ "$attempt" -eq 3 ] && exit 1
            clean
            sleep 10
          done
          grep -q "Pkg.Revision = ${NDK_VERSION}" "${ANDROID_HOME}/ndk/${NDK_VERSION}/source.properties"

      # --local: monta neste runner, nao na nuvem da Expo (sem cota de build). O
      # EXPO_TOKEN so autoriza baixar a keystore e ler o versionCode remoto: assinar
      # sempre com a mesma chave e o que faz o APK instalar por cima do anterior.
      - name: Montar o APK RC
        id: build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_KEY }}
          MYINSTANTS_BUILD_LABEL: ${{ steps.rc.outputs.version }}
        run: |
          set -euo pipefail
          APK="$PWD/build/my-instants-$MYINSTANTS_BUILD_LABEL.apk"
          mkdir -p "$(dirname "$APK")"
          npx eas build \
            --profile preview \
            --platform android \
            --local \
            --non-interactive \
            --output "$APK"
          ls -lh "$APK"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: Guardar o APK
        uses: actions/upload-artifact@v4
        with:
          name: my-instants-${{ steps.rc.outputs.version }}
          path: mobile/build/*.apk
          if-no-files-found: error
          retention-days: 14

      # Depois do build: uma tag empurrada nao se desfaz, e queimar um numero de RC num
      # build que falhou deixa um buraco na sequencia.
      - name: Criar tag git
        env:
          RC: ${{ steps.rc.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag "$RC"
          git push origin "$RC"

      - name: Comentar o RC no PR
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          message: |
            📱 APK RC publicado: `${{ steps.rc.outputs.version }}`

            **[Baixar nesta execução](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})**
            — artefato `my-instants-${{ steps.rc.outputs.version }}`, no rodapé da página. Vem
            dentro de um `.zip` e expira em 14 dias.

            Android apenas. Assinado com a mesma keystore do release, então **instala por
            cima** do app que já está no celular.

            Em **Ajustes**, o rodapé mostra `app ${{ steps.rc.outputs.version }}` — é assim que
            você confirma que está olhando este build, e não o release.
